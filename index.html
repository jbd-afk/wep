<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEP - Site du week-end</title>
<style>
:root{--bg:#f8fafc;--dark:#0f172a;--card:#fff;--line:#e2e8f0;--amber:#f59e0b}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:#0f172a;padding-bottom:70px}
header{background:var(--dark);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:900}
header p{font-size:11px;color:#94a3b8}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;justify-content:center}
nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
nav button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
main{max-width:1000px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:8px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit}
textarea{width:100%}
button.b{background:var(--dark);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
button.o{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.b-done{background:#d1fae5;color:#047857}
.b-live{background:#fef3c7;color:#b45309}
.b-soon{background:#f1f5f9;color:#475569}
.team{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pers{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.avatar{width:52px;height:52px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:18px}
.ups{position:fixed;right:14px;bottom:14px;z-index:60;width:290px;display:flex;flex-direction:column;gap:8px}
.up{background:var(--dark);color:#fff;border-radius:12px;padding:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.big{font-size:30px;font-weight:900}
input:disabled,select:disabled,button:disabled{background:#f1f5f9;color:#94a3b8;opacity:.7}
.full{position:fixed;inset:0;background:#020617;color:#fff;z-index:100;padding:22px;overflow:auto}
.full button.o{background:#1e293b;border-color:#334155;color:#e2e8f0}
</style>
</head>
<body>
<header>
  <div><h1 id="logoWrap">WEP &#127936;</h1><p id="sub">Le week-end annuel &middot; souvenirs &amp; live</p></div>
  <div class="row"><input type="file" accept="image/*" id="logoFile" style="display:none" onchange="logoPick(this)"><button class="o" id="logoBtn" title="Changer le logo" style="display:none">&#128444; Logo</button><button class="o" id="resetBtn" title="Reinitialiser les donnees de cet appareil">↺ Réinit.</button><button class="o" id="modeBtn"></button></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div class="ups" id="ups"></div>
<script>
'use strict';
var YEAR='2026';
var WEP_START=new Date('2027-06-11T17:00:00').getTime();
var DEF={
 people:[
  {id:1,fn:'Jean-Baptiste',ln:'Dumoulin',al:'La Tour',bd:'1988-04-12',co:'#e11d48',tr:['Interieur'],yrs:['2023','2024','2025','2026']},
  {id:2,fn:'Marc',ln:'Girard',al:'Le Sniper',bd:'1990-09-03',co:'#2563eb',tr:['3 points'],yrs:['2024','2025','2026']},
  {id:3,fn:'Lea',ln:'Fontaine',al:'L Eclair',bd:'1992-01-25',co:'#16a34a',tr:['Meneuse'],yrs:['2024','2025','2026']},
  {id:4,fn:'Thomas',ln:'Berger',al:'Le Mur',bd:'1986-11-30',co:'#f59e0b',tr:['Rebond'],yrs:['2023','2024','2025','2026']},
  {id:5,fn:'Sophie',ln:'Marchand',al:'La Stratege',bd:'1994-06-18',co:'#7c3aed',tr:['Vision'],yrs:['2025','2026']}],
 teams:[{id:1,nm:'Team Alpha',co:'#0ea5e9',mb:[1,3,4]},{id:2,nm:'Les Verts',co:'#16a34a',mb:[2,5]}],
 matches:[
  {id:1,di:'Basket 3x3',st:'done',tm:'Sam 14h00',a:1,b:2,sa:21,sb:15,pa:[1,3],pb:[2,5],ts:null},
  {id:2,di:'Baby-foot',st:'live',tm:'Sam 16h30',a:2,b:1,sa:4,sb:4,pa:[2,5],pb:[1],ts:null},
  {id:3,di:'Ultimate',st:'soon',tm:'Dim 10h00',a:1,b:2,sa:null,sb:null,pa:[],pb:[],ts:null}],
 news:[
  {id:1,au:'JB',dt:'12/11/2026',pin:true,tx:'Le WEP 2026 est officiellement programme ! Reservez votre week-end, le lieu sera annonce tres bientot.',cm:[{au:'Marc',tx:'Premier inscrit !'}],re:{'F':4,'B':2}}],
 past:[
  {yr:'2025',dt:'13-15 juin 2025',pl:'Gite des Cotterelles, Blois',pr:[1,2,3,4,5],
   tm:[{nm:'Les Aigles',co:'#7c3aed',mb:[1,2]},{nm:'Les Requins',co:'#0ea5e9',mb:[3,4]},{nm:'Les Ours',co:'#f59e0b',mb:[5]}],
   rs:[{t:'Les Aigles',p:14,w:5,l:1},{t:'Les Requins',p:11,w:4,l:2},{t:'Les Ours',p:6,w:2,l:4}]},
  {yr:'2024',dt:'14-16 juin 2024',pl:'Chalet a Chamonix',pr:[1,2,3,4],
   tm:[{nm:'Team Ocean',co:'#0ea5e9',mb:[2,3]},{nm:'Team Montagne',co:'#16a34a',mb:[1,4]}],
   rs:[{t:'Team Ocean',p:12,w:4,l:1},{t:'Team Montagne',p:10,w:3,l:2}]},
  {yr:'2023',dt:'16-18 juin 2023',pl:'Maison a Biarritz',pr:[1,4],
   tm:[{nm:'Rouge',co:'#e11d48',mb:[1]},{nm:'Bleu',co:'#2563eb',mb:[4]}],
   rs:[{t:'Rouge',p:9,w:3,l:0},{t:'Bleu',p:6,w:2,l:1}]}]
};
var S=JSON.parse(localStorage.getItem('wep-site')||'null')||JSON.parse(JSON.stringify(DEF));
var TABS=[['scoreboard','Scoreboard'],['accueil','Accueil'],['fil','Le fil WEP'],['live','Le live'],['membres','Les WEPiens'],['archives','Les archives']];
var tab='scoreboard',ed='2026';
var ORGA_CODE='wep2026';
var qs=(location.search||'').replace('?','').split('&'),i;
var orga=false;
for(i=0;i<qs.length;i++){if(qs[i]==='orga='+ORGA_CODE)orga=true;}
var orgaLink=location.href.split('?')[0].split('#')[0]+'?orga='+ORGA_CODE;
function save(){localStorage.setItem('wep-site',JSON.stringify(S));schPush();}
var SYU=localStorage.getItem('wep-syncu')||'',SYK=localStorage.getItem('wep-synck')||'';
var pushT=null,syncing=false,syncingIn=false;
function syncOk(){return !!(SYU&&SYK);}
function schPush(){if(!syncOk()||syncingIn)return;clearTimeout(pushT);pushT=setTimeout(function(){pushSync(true);},4000);}
function syncBadge(){var e=document.getElementById('syncLit');if(e)e.innerHTML=syncOk()?(S._sync?'&#9989; Derniere sync : '+new Date(S._sync).toLocaleString('fr-FR'):'&#128257; Sync configuree, pas encore partagee'):'&#9888; Sync non configuree : donnees locales a cet appareil';}
async function pushSync(quiet){
 if(!syncOk()){if(!quiet)alert('Renseigne l\'URL et la cle de sync dans le Fil WEP.');return;}
 if(syncing)return;
 syncing=true;
 S._sync=new Date().toISOString();
 syncingIn=true;try{localStorage.setItem('wep-site',JSON.stringify(S));}catch(e){}syncingIn=false;
 try{
  var r=await fetch(SYU,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':SYK},body:JSON.stringify(S)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  if(!quiet)alert('Donnees partagees.');
 }catch(e){if(!quiet)alert('Sync impossible : '+e.message);}
 syncing=false;syncBadge();
}
async function pullSync(quiet){
 if(!syncOk()){if(!quiet)alert('Renseigne l\'URL et la cle de sync dans le Fil WEP.');return;}
 try{
  var r=await fetch(SYU,{cache:'no-store',headers:{'X-Master-Key':SYK}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  var d=await r.json();
  if(d&&d.record&&d.record.teams)d=d.record;   // format JSONBin v3
  if(d&&d.teams){
   if((d._sync||'')>(S._sync||'')){syncingIn=true;S=d;try{localStorage.setItem('wep-site',JSON.stringify(S));}catch(e){}syncingIn=false;render();}
   if(!quiet)alert((d._sync||'')>(S._sync||'')?'Donnees recuperees (plus recentes).':'Tes donnees sont deja les plus recentes.');
  }else if(!quiet)alert('La ressource de sync ne contient pas encore de donnees WEP.');
 }catch(e){if(!quiet)alert('Sync impossible : '+e.message);}
 syncBadge();
}
async function saveSyncCfg(){
 SYU=(document.getElementById('syu').value||'').trim();SYK=(document.getElementById('syk').value||'').trim();
 localStorage.setItem('wep-syncu',SYU);localStorage.setItem('wep-synck',SYK);
 syncBadge();
 var h=document.getElementById('syncView');if(h)h.innerHTML=vSyncBox();
 if(syncOk())pullSync(false);
}
function vSyncBox(){var h='<div class="card" id="syncView"><div class="h">SYNCHRONISATION</div>';
 if(orga){h+='<div style="font-size:12px;margin-bottom:6px">URL de sync (GET+PUT JSON type JSONBin/Supabase) et cle (en-tete X-Master-Key) :</div><input id="syu" placeholder="URL de sync" style="width:100%;margin-bottom:4px" value="'+esc(SYU)+'"><input id="syk" type="password" placeholder="Cle" style="width:100%;margin-bottom:6px" value="'+esc(SYK)+'"><button class="b" onclick="saveSyncCfg()">Enregistrer la config</button>';}
 h+='<div class="row" style="margin-top:8px"><button class="o" onclick="pullSync(false)">&#11015; Recuperer</button><button class="o" onclick="pushSync(false)">&#11014; Partager</button></div><span id="syncLit" style="font-size:11px;color:#64748b"></span></div>';
 return h;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function pe(id){for(var i=0;i<S.people.length;i++){if(S.people[i].id===id)return S.people[i];}return null;}
function te(id){for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id)return S.teams[i];}return null;}
function pal(p){return p.al||p.fn;}
function tp(t){return t?'<span class="team"><span class="dot" style="background:'+t.co+'"></span>'+esc(t.nm)+'</span>':'?';}
function stb(m){return m.st==='done'?'<span class="badge b-done">termine</span>':m.st==='live'?'<span class="badge b-live">EN COURS</span>':'<span class="badge b-soon">a venir</span>';}
function ups(txt){var d=document.createElement('div');d.className='up';
 d.innerHTML='<div id="notif"></div><div style="font-size:10px;color:#94a3b8;margin-top:4px">WEP &middot; toucher pour fermer</div>';
 d.querySelector('#notif').textContent=txt;
 d.onclick=function(){d.remove();};document.getElementById('ups').appendChild(d);
 setTimeout(function(){d.remove();},8000);}
function nfmt(ms){var s=Math.max(0,Math.floor(ms/1000));var m=Math.floor(s/60);
 return (m<10?'0':'')+m+':'+(s%60<10?'0':'')+(s%60);}
function stnds(){var r={};S.teams.forEach(function(t){r[t.id]={nm:t.nm,co:t.co,p:0,w:0,l:0};});
 S.matches.filter(function(m){return m.st==='done'}).forEach(function(m){
  if(m.sa>m.sb){r[m.a].p+=3;r[m.a].w++;r[m.b].l++;}
  else if(m.sb>m.sa){r[m.b].p+=3;r[m.b].w++;r[m.a].l++;}
  else{r[m.a].p++;r[m.b].p++;}});
 var a=[];for(var k in r)a.push(r[k]);a.sort(function(x,y){return y.p-x.p;});return a;}
function totals(){var t={};S.teams.forEach(function(x){t[x.id]=0;});
 S.matches.forEach(function(m){if(m.st==='soon')return;
  if(t[m.a]!==undefined)t[m.a]+=m.sa||0;
  if(t[m.b]!==undefined)t[m.b]+=m.sb||0;});return t;}
function bump(id,s,d){S.matches.forEach(function(m){if(m.id!==id)return;
  m['s'+s]=Math.max(0,(m['s'+s]||0)+d);
  if(m.st==='soon'){m.st='live';m.ts=Date.now();if(m.sa===null)m.sa=0;if(m.sb===null)m.sb=0;}});
 save();if(window.inProj){drawProj();}else{render();}}
function setst(id,st){S.matches.forEach(function(m){if(m.id!==id)return;m.st=st;
  if(st==='live'&&!m.ts){m.ts=Date.now();if(m.sa===null)m.sa=0;if(m.sb===null)m.sb=0;}
  if(st==='done'){m.ts=null;ups('Resultat '+m.di+' : '+te(m.a).nm+' '+m.sa+' - '+m.sb+' '+te(m.b).nm);}});
 save();if(window.inProj){drawProj();}else{render();}}
function players(m,s){return m['p'+s].map(function(i){var p=pe(i);return p?pal(p):null;}).filter(Boolean).join(', ');}

// ---------- Scoreboard ----------
function vScore(){
 var n=new Date(),T=totals();
 var live=S.matches.filter(function(m){return m.st==='live';});
 var fin=S.matches.filter(function(m){return m.st==='done';});
 var soon=S.matches.filter(function(m){return m.st==='soon';});
 var sd=stnds();
 var h='';
 h+='<div class="row" style="justify-content:space-between;margin-bottom:10px"><div><div style="font-size:12px;color:#64748b;text-transform:capitalize" id="dateline"></div><div class="big" id="clock"></div></div><button class="b" onclick="openProj()">&#128250; Mode projecteur</button></div>';
 h+='<div class="card" style="text-align:center"><div class="h">TOTAL DU WEEK-END</div><div class="row" style="justify-content:center;gap:30px">';
 S.teams.forEach(function(t){h+='<div><div style="font-size:12px;font-weight:700">'+tp(t)+'</div><div style="font-size:44px;font-weight:900;color:'+t.co+'">'+T[t.id]+'</div></div>';});
 h+='</div></div>';
 h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start">';
 h+='<div class="card"><div class="h">MATCHS REALISES</div>';
 if(!fin.length)h+='<div style="font-size:12px;color:#94a3b8">Aucun match termine</div>';
 fin.forEach(function(m){h+='<div style="border-bottom:1px solid var(--line);padding:7px 0;font-size:13px"><div style="font-size:10px;color:#94a3b8">'+esc(m.tm)+' &middot; '+esc(m.di)+'</div><div class="row" style="justify-content:space-between" id="fin'+m.id+'"></div></div>';});
 h+='</div>';
 h+='<div class="card" id="livecard">';
 if(!live.length)h+='<div style="text-align:center;color:#94a3b8;font-size:13px;padding:20px">Aucun match en cours</div>';
 live.forEach(function(m){
  var A=te(m.a),B=te(m.b);
  h+='<div style="text-align:center" id="livewrap'+m.id+'"></div>';
 });
 h+='</div>';
 h+='<div class="card"><div class="h">A VENIR</div>';
 if(!soon.length)h+='<div style="font-size:12px;color:#94a3b8">Rien de programme</div>';
 soon.forEach(function(m){h+='<div style="border-bottom:1px solid var(--line);padding:7px 0;font-size:13px"><div style="font-size:10px;color:#94a3b8">'+esc(m.tm)+' &middot; '+esc(m.di)+'</div><div class="row" style="justify-content:space-between">'+tp(te(m.a))+' <span style="font-size:10px;color:#94a3b8">vs</span> '+tp(te(m.b))+'</div></div>';});
 h+='</div></div>';
 var liveOne=S.matches.filter(function(m){return m.st==='live';})[0];
 if(!liveOne){h+='<div class="card"><div class="h">CLASSEMENT PROVISOIRE</div>';
  sd.forEach(function(r,i){h+='<div class="row" style="justify-content:space-between;padding:5px 0;font-size:14px"><span>'+(i+1)+'. <span class="team"><span class="dot" style="background:'+r.co+'"></span>'+esc(r.nm)+'</span> <small style="color:#94a3b8">'+r.w+'V-'+r.l+'D</small></span><b>'+r.p+' pts</b></div>';});
  h+='</div>';}
 return h;
}
function fillScoreLive(){
 var live=S.matches.filter(function(m){return m.st==='live';});
 var liveEl=null;
 document.querySelectorAll('[id^=livewrap]').forEach(function(e){liveEl=e;});
 live.forEach(function(m){
  var e=document.getElementById('livewrap'+m.id);if(!e)return;
  var A=te(m.a),B=te(m.b);
  e.innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:6px">'+stb(m)+'<span style="font-size:11px;color:#64748b">'+esc(m.tm)+' &middot; '+esc(m.di)+'</span></div>'
  +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:6px">'
  +'<div><div style="font-weight:900;font-size:18px;color:'+A.co+'">'+esc(A.nm)+'</div><div style="font-size:11px;color:#64748b">'+esc(players(m,'a'))+'</div></div>'
  +'<div><div style="font-size:40px;font-weight:900" id="lsco">'+(m.sa||0)+' - '+(m.sb||0)+'</div><div style="font-size:18px;font-weight:800;color:var(--amber)" id="lchr">&#9201; '+(m.ts?nfmt(Date.now()-m.ts):'--:--')+'</div><div style="font-size:10px;color:#94a3b8">duree du match</div></div>'
  +'<div><div style="font-weight:900;font-size:18px;color:'+B.co+'">'+esc(B.nm)+'</div><div style="font-size:11px;color:#64748b">'+esc(players(m,'b'))+'</div></div>'
  +'</div>'
  +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">'
  +'<button class="b" style="background:'+A.co+'" onclick="bump('+m.id+',\'a\',1)">+1 '+esc(A.nm)+'</button>'
  +'<button class="b" style="background:'+B.co+'" onclick="bump('+m.id+',\'b\',1)">+1 '+esc(B.nm)+'</button>'
  +'<button class="o" onclick="bump('+m.id+',\'a\',-1)">-1 '+esc(A.nm)+'</button>'
  +'<button class="o" onclick="bump('+m.id+',\'b\',-1)">-1 '+esc(B.nm)+'</button>'
  +'<button class="o" style="grid-column:1/3" onclick="setst('+m.id+',\'done\')">Terminer le match (alerte resultats)</button></div>';
 });
}
function fillScoreStatics(){
 var fin=S.matches.filter(function(m){return m.st==='done';});
 fin.forEach(function(m){
  var e=document.getElementById('fin'+m.id);if(!e)return;
  e.innerHTML=tp(te(m.a))+' <b>'+(m.sa||0)+' - '+(m.sb||0)+'</b> '+tp(te(m.b));
 });
 var d=document.getElementById('dateline');
 if(d)d.textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}

// ---------- Accueil ----------
function vHome(){
 var days=Math.max(0,Math.ceil((WEP_START-Date.now())/86400000));
 var h='<div class="card" style="text-align:center;background:var(--dark);color:#fff;border:0"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#94a3b8">Prochain WEP</div><div style="font-size:46px;font-weight:900">'+days+' jours</div><div style="font-size:12px;color:#94a3b8">11-13 juin 2027 &middot; lieu a venir</div></div>';
 h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="card"><div class="h">DERNIERES NOUVELLES</div>';
 S.news.slice(0,3).forEach(function(n){h+='<div style="font-size:13px;padding:4px 0"><b style="font-size:10px;color:#94a3b8">'+esc(n.dt)+'</b> '+esc(n.tx.slice(0,80))+'...</div>';});
 h+='</div><div class="card"><div class="h">PROCHAINS RENDEZ-VOUS</div>';
 S.matches.filter(function(m){return m.st!=='done';}).slice(0,3).forEach(function(m){h+='<div style="font-size:13px;padding:4px 0"><span style="color:#94a3b8">'+esc(m.tm)+'</span> &middot; '+esc(m.di)+'</div>';});
 h+='</div></div>';
 var p=S.past[0];
 h+='<div class="card"><div class="h">SOUVENIRS &middot; WEP '+p.yr+'</div><div style="font-size:13px">'+esc(p.pl)+' &middot; '+p.pr.length+' participants &middot; photos de l\'edition ici &#128248;</div></div>';
 return h;
}

// ---------- Fil WEP ----------
function vNews(){
 var h='';
 h+=vSyncBox();
 if(orga){h+='<div class="card" style="background:#fffbeb;border-color:#fde68a"><div class="h">LIENS A PARTAGER</div><div style="font-size:12px"><b>Consultation (WEPiens) :</b> spectateur, tout le monde peut lire, commenter, reagir et demarrer un match.<br><span style="word-break:break-all">'+esc(location.href.split('?')[0].split('#')[0])+'</span></div><div style="font-size:12px;margin-top:6px"><b>Organisateur (a garder prive) :</b> lien avec code '+esc(ORGA_CODE)+'<br><span style="word-break:break-all">'+esc(orgaLink)+'</span></div></div>';}
 if(orga){h+='<div class="card"><textarea id="ndraft" rows="2" placeholder="Une actu, une annonce, un souvenir..."></textarea><div style="margin-top:8px"><button class="b" onclick="postNews()">Publier</button></div></div>';}
 S.news.forEach(function(n){

 h+='</div>';

 if(live.length){

  h+='<div style="color:#64748b;font-size:13px;margin-bottom:14px">Aucun match en cours &middot; rotation automatique</div>';
  if(slide%3===0){h+='<div class="h">CLASSEMENT</div>';
   sd.forEach(function(r,i){h+='<div class="row" style="justify-content:space-between;font-size:24px;border-bottom:1px solid #1e293b;padding:8px 0"><span><span style="color:#475569">'+(i+1)+'.</span> <span style="color:'+r.co+'">'+esc(r.nm)+'</span></span><b style="color:'+r.co+'">'+r.p+' pts</b></div>';});}
  if(slide%3===1){h+='<div class="h">DERNIERS RESULTATS</div>';
   fin.slice(-3).forEach(function(m){h+='<div style="font-size:20px;padding:6px 0">'+esc(te(m.a).nm)+' <b>'+m.sa+' - '+m.sb+'</b> '+esc(te(m.b).nm)+'</div>';});
   if(!fin.length)h+='<div style="color:#475569">Les resultats s\'afficheront ici</div>';
   h+='<div class="h" style="margin-top:18px">PROCHAINS MATCHS</div>';
   soon.forEach(function(m){h+='<div style="font-size:16px;color:#cbd5e1;padding:3px 0">'+esc(m.tm)+' &middot; '+esc(m.di)+'</div>';});}
  if(slide%3===2){h+='<div class="h">TOTAL DU WEEK-END</div>';
   S.teams.forEach(function(t){h+='<div class="row" style="justify-content:space-between;border-bottom:1px solid #1e293b;padding:10px 0"><span style="font-size:26px;font-weight:800;color:'+t.co+'">'+esc(t.nm)+'</span><span style="font-size:44px;font-weight:900;color:'+t.co+'">'+T[t.id]+'</span></div>';});}
 }
 h+='</div>';
 // droite : total a venir
 h+='<div><div class="h">TOTAL</div>';
 S.teams.forEach(function(t){h+='<div class="row" style="justify-content:space-between;border-bottom:1px solid #1e293b;padding:8px 0"><span class="team"><span class="dot" style="background:'+t.co+'"></span>'+esc(t.nm)+'</span><b style="color:'+t.co+'">'+T[t.id]+'</b></div>';});
 h+='<div class="h" style="margin-top:18px">A VENIR</div>';
 soon.forEach(function(m){h+='<div style="font-size:13px;color:#94a3b8;padding:3px 0">'+esc(m.tm)+' &middot; '+esc(m.di)+'</div>';});
 h+='</div></div>';
 el.innerHTML=h;
}

// ---------- Noyau ----------
function nav(){var n=document.getElementById('nav');var h='';
 TABS.forEach(function(t){h+='<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';});
 n.innerHTML=h;}
function go(t){tab=t;nav();render();}
function render(){var app=document.getElementById('app');if(!app)return;syncBadge();
 var h='';
 if(tab==='scoreboard')h=vScore();
 if(tab==='accueil')h=vHome();
 if(tab==='fil')h=vNews();
 if(tab==='live')h=vLive();
 if(tab==='membres')h=vMembers();
 if(tab==='archives')h=vArch();
 app.innerHTML=h;
 var mb=document.getElementById('modeBtn');
 if(mb)mb.textContent=orga?'Mode organisateur OK':'Mode spectateur';
 var rb=document.getElementById('resetBtn');if(rb)rb.style.display=orga?'':'none';
 var lb2=document.getElementById('logoBtn');if(lb2)lb2.style.display=orga?'':'none';
 if(tab==='membres'&&orga){var abtn=document.getElementById('maddbtn'),acbtn=document.getElementById('mcancelbtn');
  if(abtn)abtn.textContent=editId?'Enregistrer':'Ajouter';
  if(acbtn)acbtn.style.display=editId?'':'none';
  if(editId){var ep=pe(editId);
   if(ep){document.getElementById('mfn').value=ep.fn;document.getElementById('mmln').value=ep.ln;
    document.getElementById('mal').value=ep.al||'';document.getElementById('mbd').value=ep.bd||'';}}}
 if(tab==='scoreboard'){fillScoreLive();fillScoreStatics();}
}
function delPerson(id){if(!confirm('Supprimer ce WEPien ? Il sera retire des equipes et des matchs.'))return;
 S.people=S.people.filter(function(p){return p.id!==id;});
 S.teams.forEach(function(t){t.mb=t.mb.filter(function(i){return i!==id;});});
 S.matches.forEach(function(m){m.pa=m.pa.filter(function(i){return i!==id;});m.pb=m.pb.filter(function(i){return i!==id;});});
 save();render();}
function delTeam(id){if(!confirm('Supprimer cette equipe ? Ses matchs seront aussi supprimes.'))return;
 S.teams=S.teams.filter(function(t){return t.id!==id;});
 S.matches=S.matches.filter(function(m){return m.a!==id&&m.b!==id;});
 save();render();}
function delMatch(id){if(!confirm('Supprimer ce match ?'))return;
 S.matches=S.matches.filter(function(m){return m.id!==id;});save();render();}
function delNews(id){if(!confirm('Supprimer cette publication ?'))return;
 S.news=S.news.filter(function(n){return n.id!==id;});save();render();}
document.getElementById('modeBtn').onclick=function(){alert(orga?'Tu es deja en mode organisateur (lien organisateur).':'Mode organisateur : ouvre le lien organisateur (avec le code).');};
function applyLogo(){var l=localStorage.getItem('wep-logo');var w=document.getElementById('logoWrap');
 if(!w)return;if(l){w.innerHTML='<img src="'+l+'" alt="WEP" style="max-height:88px;vertical-align:middle;border-radius:8px">';}
 else{w.innerHTML='WEP &#127936;';}}
function logoPick(input){var f=input.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){var img=new Image();img.onload=function(){var c=document.createElement('canvas');var maxW=420,scale=Math.min(1,maxW/img.width);
  c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  localStorage.setItem('wep-logo',c.toDataURL('image/png'));applyLogo();};
  img.src=r.result;};r.readAsDataURL(f);}
function logoDel(){localStorage.removeItem('wep-logo');applyLogo();}
document.getElementById('logoBtn').onclick=function(){document.getElementById('logoFile').click();};
applyLogo();
document.getElementById('resetBtn').onclick=function(){if(confirm('Reinitialiser toutes les donnees de cet appareil et revenir aux donnees par defaut du code ?')){localStorage.removeItem('wep-site');location.reload();}};
 syncBadge();pullSync(true);setInterval(function(){pullSync(true);},60000);
var savedTab=sessionStorage.getItem('wep-tab');
if(savedTab){tab=savedTab;sessionStorage.removeItem('wep-tab');}
nav();render();
setInterval(function(){
 var c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString('fr-FR');
 var lchr=document.getElementById('lchr'),lsco=document.getElementById('lsco');
 var live=S.matches.filter(function(m){return m.st==='live';})[0];
 if(live&&lchr){lchr.innerHTML='&#9201; '+(live.ts?nfmt(Date.now()-live.ts):'--:--');}
 if(live&&lsco){lsco.textContent=(live.sa||0)+' - '+(live.sb||0);}
},1000);
</script>
